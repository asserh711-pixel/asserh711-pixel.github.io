<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-md">
    
    <!-- رأس الصفحة / الشعار -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full border-4 border-blue-600 mx-auto overflow-hidden mb-3 bg-blue-50 flex items-center justify-center text-3xl">
        🔑
      </div>
      <h1 class="text-2xl font-bold text-gray-800">تسجيل الدخول للمنصة</h1>
      <p class="text-gray-500 text-sm mt-1">أدخل بياناتك للوصول لدروسك وامتحاناتك</p>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form onsubmit="handleLogin(event)" class="space-y-5">
      
      <!-- كود الطالب أو رقم الموبايل -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">رقم الموبايل</label>
        <input 
          type="text" 
          required 
          placeholder="مثال: 01012345678" 
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-right transition"
        >
      </div>

      <!-- كلمة المرور -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
        <input 
          type="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-right transition"
        >
      </div>

      <!-- زر الدخول -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-200 text-base"
      >
        دخول المنصة 🚀
      </button>

    </form>

    <!-- رابط العودة للرئيسية -->
    <div class="mt-6 text-center border-t border-gray-100 pt-4">
      <a href="index.html" class="text-sm font-bold text-blue-600 hover:underline">
        ⬅️ العودة للصفحة الرئيسية
      </a>
    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert('تم تسجيل الدخول بنجاح! جاري تحويلك للمنصة...');
      window.location.href = 'index.html'; // بيوجه الطالب للرئيسية بعد الدخول
    }
  </script>

</body>
</html>
