<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد - أكاديمية عبدالعزيز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    
    /* إعدادات الوضع الليلي المطابقة لصفحة تسجيل الدخول */
    body.dark-mode { background-color: #0f172a !important; color: #f1f5f9 !important; }
    body.dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f1f5f9 !important; }
    body.dark-mode .text-gray-800, body.dark-mode .text-gray-700 { color: #e2e8f0 !important; }
    body.dark-mode input, body.dark-mode select { background-color: #0f172a !important; border-color: #334155 !important; color: #fff !important; }
    body.dark-mode .border-gray-100 { border-color: #334155 !important; }

    /* تصميم زرار الوضع الليلي المتحرك مثل login */
    .theme-switch-container { width: 90px; height: 44px; background-color: #e2e8f0; border-radius: 9999px; position: relative; cursor: pointer; display: flex; align-items: center; padding: 4px; transition: 0.3s; }
    body.dark-mode .theme-switch-container { background-color: #334155; }
    .theme-switch-thumb { width: 36px; height: 36px; background-color: #fff; border-radius: 50%; position: absolute; right: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    body.dark-mode .theme-switch-thumb { transform: translateX(-46px); background-color: #1e293b; }

    /* تأثيرات ظهور الرسالة المنبثقة السلسة */
    #customModal {
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #customModal > div {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      transform: scale(0.9);
      opacity: 0;
    }
    #customModal:not(.hidden) > div {
      transform: scale(1);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex flex-col items-center justify-center p-4">

  <!-- زر الوضع الليلي مع النص تحته تماماً مثل صفحة الدخول -->
  <div class="mb-6 flex flex-col items-center">
    <div onclick="toggleDarkMode()" id="themeToggleBtn" class="theme-switch-container">
      <div class="theme-switch-thumb" id="themeThumb">🌙</div>
    </div>
    <span id="themeText" class="text-xs font-bold text-gray-500 dark:text-gray-400 mt-1.5 select-none">Dark mode</span>
  </div>

  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 w-full max-w-md">
    
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full border-4 border-emerald-600 mx-auto overflow-hidden mb-3 bg-emerald-50 flex items-center justify-center text-3xl">
        ✨
      </div>
      <h1 class="text-2xl font-bold text-gray-800">حساب جديد</h1>
      <p class="text-gray-500 text-sm mt-1">سجل بياناتك للانضمام إلينا</p>
    </div>

    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">الاسم كامل / Name</label>
        <input type="text" id="fullName" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">رقم الموبايل / .Mobile no</label>
        <input type="tel" id="regPhone" required maxlength="11" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني / Email (اختياري)</label>
        <input type="email" id="regEmail" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">المرحلة الدراسية / Grade level</label>
        <select id="regStage" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right bg-white transition">
          <option value="الأول الإعدادي">الأول الإعدادي</option>
          <option value="الثاني الإعدادي">الثاني الإعدادي</option>
          <option value="الثالث الإعدادي">الثالث الإعدادي</option>
          <option value="الأول الثانوي">الأول الثانوي</option>
          <option value="الثاني الثانوي">الثاني الثانوي</option>
          <option value="الثالث الثانوي">الثالث الثانوي</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور / Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 text-right transition">
      </div>

      <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition shadow-md shadow-emerald-200 text-base mt-2 cursor-pointer">
        إنشاء الحساب 🚀
      </button>
    </form>

    <div class="mt-6 text-center border-t border-gray-100 pt-4">
      <a href="login.html" class="text-sm font-bold text-gray-600 hover:text-blue-600">
        ⬅️ لديك حساب بالفعل؟ تسجيل الدخول
      </a>
    </div>

  </div>

  <!-- رسالة التنبيه المنبثقة (Custom Modal) المخصصة للتنبيهات والنجاح -->
  <div id="customModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50 opacity-0 visibility-hidden pointer-events-none">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-gray-100 text-center space-y-4">
      <div id="modalIcon" class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
        ✨
      </div>
      <h3 id="modalTitle" class="text-lg font-bold text-gray-800">تنبيه</h3>
      <p id="modalMessage" class="text-gray-600 text-sm font-medium leading-relaxed">
        <!-- سيتم إدراج النص هنا برمجياً -->
      </p>
      <button id="modalActionBtn" onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow cursor-pointer">
        حسناً
      </button>
    </div>
  </div>

  <script>
    // وظيفة تبديل الوضع الليلي
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const thumb = document.getElementById('themeThumb');
      const themeText = document.getElementById('themeText');
      const isDark = document.body.classList.contains('dark-mode');
      
      localStorage.setItem("theme", isDark ? "dark" : "light");
      
      if (isDark) {
        thumb.innerHTML = "☀️";
        themeText.textContent = "Light mode";
      } else {
        thumb.innerHTML = "🌙";
        themeText.textContent = "Dark mode";
      }
    }

    // تفعيل الوضع الليلي تلقائياً إذا كان محفوظاً مسبقاً
    window.onload = () => {
      if(localStorage.getItem("theme") === "dark") {
        document.body.classList.add('dark-mode');
        const thumb = document.getElementById('themeThumb');
        const themeText = document.getElementById('themeText');
        if(thumb && themeText) {
          thumb.innerHTML = "☀️";
          themeText.textContent = "Light mode";
        }
      }
    }

    // دوال التحكم بالنافذة المنبثقة الأنيقة
    function showModal(message, isSuccess = false, callback = null) {
      document.getElementById('modalMessage').innerText = message;
      
      const iconEl = document.getElementById('modalIcon');
      const titleEl = document.getElementById('modalTitle');
      const btnEl = document.getElementById('modalActionBtn');

      if (isSuccess) {
        iconEl.innerHTML = "✔️";
        titleEl.innerText = "تم";
        btnEl.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow cursor-pointer";
      } else {
        iconEl.innerHTML = "⚠️";
        titleEl.innerText = "تنبيه";
        btnEl.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition shadow cursor-pointer";
      }

      const modal = document.getElementById('customModal');
      modal.classList.remove('hidden', 'opacity-0', 'visibility-hidden', 'pointer-events-none');

      // تخزين الوظيفة التي ستنفذ عند الضغط على زر حسناً
      window.modalCallback = callback;
    }

    function closeModal() {
      const modal = document.getElementById('customModal');
      modal.classList.add('opacity-0', 'visibility-hidden', 'pointer-events-none');
      setTimeout(() => {
        modal.classList.add('hidden');
        if (typeof window.modalCallback === 'function') {
          window.modalCallback();
          window.modalCallback = null;
        }
      }, 300);
    }

    function handleRegister(e) {
      e.preventDefault();
      
      const name = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const stage = document.getElementById('regStage').value;
      const password = document.getElementById('regPassword').value.trim();

      if (phone.length !== 11 || isNaN(phone)) {
        showModal('⚠️ خطأ: يجب أن يتكون رقم الموبايل من 11 رقم صحيح!');
        return;
      }

      let users = JSON.parse(localStorage.getItem("academyUsers")) || [];

      // التحقق مما إذا كان رقم الموبايل أو الإيميل مسجلين مسبقاً
      const userExists = users.some(u => String(u.phone).trim() === phone || (email && u.email && String(u.email).trim().toLowerCase() === email));
      
      if (userExists) {
        showModal('⚠️ رقم الموبايل أو البريد الإلكتروني مسجل بالفعل! يمكنك الانتقال لتسجيل الدخول مباشرة.', false, () => {
          window.location.href = 'login.html';
        });
        return;
      }

      // إضافة المستخدم الجديد وحفظه في الـ localStorage
      const newUser = { name, phone, email, stage, password };
      users.push(newUser);

      localStorage.setItem("academyUsers", JSON.stringify(users));

      // عرض الرسالة المطلوبة تماماً بتصميم سلس ثم الانتقال لصفحة الدخول
      showModal(".تم إنشاء الحساب بنجاح✔️.سيتم نقلك لصفحة تسجيل الدخول", true, () => {
        window.location.href = 'login.html';
      });
    }
  </script>

</body>
</html>
