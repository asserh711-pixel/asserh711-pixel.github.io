<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>أكاديمية عبدالعزيز - منصة تعليم اللغة الإنجليزية</title> 
  <!-- Tailwind CSS --> 
  <script src="https://cdn.tailwindcss.com"></script> 
  <!-- خط Cairo --> 
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 
  <style> 
    body { 
      font-family: 'Cairo', sans-serif; 
      /* خلفية ممتدة على الموقع بالكامل */ 
      background-image: linear-gradient(rgba(248, 250, 252, 0.85), rgba(248, 250, 252, 0.9)), url('bg.jpg'); 
      background-size: cover; 
      background-position: center; 
      background-attachment: fixed; /* يجعل الخلفية ثابتة أثناء التصفح */ 
    } 
  </style> 
</head> 
<body class="text-gray-800 antialiased min-h-screen"> 

  <!-- 1. الهيدر الأزرق العلوي --> 
  <header class="bg-blue-600/90 backdrop-blur-md text-white relative pt-6 pb-12 px-4 shadow-lg border-b border-blue-500/30"> 
    
    <!-- الأزرار العلوية (تسجيل الدخول، لوحة التحكم، والامتحانات) --> 
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-4"> 
      <div class="flex items-center gap-2">
        <a href="login.html" class="bg-white text-blue-600 font-bold px-4 py-2 rounded-lg shadow hover:bg-gray-100 transition flex items-center gap-2 text-sm"> 
          🔐 تسجيل الدخول 
        </a> 
        <a href="admin.html" class="bg-blue-700/80 text-white font-bold px-3 py-2 rounded-lg shadow hover:bg-blue-800 transition flex items-center gap-2 text-sm border border-blue-400/40"> 
          ⚙️ لوحة التحكم 
        </a> 
      </div>
      <a href="exams.html" class="bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg shadow hover:bg-emerald-600 transition flex items-center gap-2 text-sm"> 
        📝 الامتحانات الإلكترونية 
      </a> 
    </div> 

    <!-- البروفايل والعنوان --> 
    <div class="text-center flex flex-col items-center"> 
      <!-- دائرة صورة المدرس --> 
      <div class="w-28 h-28 rounded-full border-4 border-white/90 overflow-hidden shadow-xl mb-4 bg-gray-200"> 
        <img src="teacher.jpg" alt="صورة المدرس" class="w-full h-full object-cover"> 
      </div> 
      <h1 class="text-3xl md:text-4xl font-extrabold mb-2 tracking-wide flex items-center justify-center gap-2"> 
        📚 أكاديمية عبدالعزيز 
      </h1> 
      <p class="text-blue-100 text-sm md:text-base font-medium"> 
        منصة تعليم اللغة الإنجليزية 
      </p> 
    </div> 
  </header> 

  <!-- المحتوى الرئيسي --> 
  <main class="max-w-5xl mx-auto px-4 py-10 space-y-12"> 
    
    <!-- 2. مميزات المنصة --> 
    <section class="text-center"> 
      <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center justify-center gap-2"> 
        ⭐ مميزات المنصة 
      </h2> 
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6"> 
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 hover:shadow-md transition text-center"> 
          <div class="text-2xl font-bold mb-2 flex items-center justify-center gap-2"> 
            📺 فيديوهات شرح 
          </div> 
          <p class="text-gray-600 text-sm font-medium">شرح الدروس بطريقة سهلة ومبسطة</p> 
        </div> 
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 hover:shadow-md transition text-center"> 
          <div class="text-2xl font-bold mb-2 flex items-center justify-center gap-2"> 
            📄 ملفات PDF 
          </div> 
          <p class="text-gray-600 text-sm font-medium">ملخصات ومذكرات لكل درس</p> 
        </div> 
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 hover:shadow-md transition text-center"> 
          <div class="text-2xl font-bold mb-2 flex items-center justify-center gap-2"> 
            🎓 كل المراحل 
          </div> 
          <p class="text-gray-600 text-sm font-medium">إعدادي وثانوي في مكان واحد</p> 
        </div> 
      </div> 
    </section> 

    <!-- 3. اختيار المرحلة --> 
    <section class="text-center"> 
      <h2 class="text-2xl font-bold text-gray-800 mb-8"> 
        اختر المرحلة 
      </h2> 
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto"> 
        <!-- المرحلة الإعدادية --> 
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 text-center flex flex-col items-center justify-center space-y-4"> 
          <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2"> 
            📘 الإعدادي 
          </h3> 
          <a href="prep.html" class="bg-blue-600 text-white font-bold px-8 py-2 rounded-xl hover:bg-blue-700 transition w-32 shadow-sm inline-block"> 
            دخول 
          </a> 
        </div> 
        <!-- المرحلة الثانوية --> 
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-white/60 text-center flex flex-col items-center justify-center space-y-4"> 
          <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2"> 
            📗 الثانوي 
          </h3> 
          <a href="secondary.html" class="bg-blue-600 text-white font-bold px-8 py-2 rounded-xl hover:bg-blue-700 transition w-32 shadow-sm inline-block"> 
            دخول 
          </a> 
        </div> 
      </div> 
    </section> 

  </main> 
</body> 
</html>
